name: release-assets
#     ^^^^^^^^^^^^^^
# https://github.com/organization/repository/workflows/release-assets/badge.svg
#                                                      ^^^^^^^^^^^^^^

# リリースを publish したら、タグをクリーンに checkout してアーカイブをビルドし、リリースにアップロードする。
# v0.0.18-rc.6 は手元の書き換わった作業ツリーからビルドされ、INTERVAL 7 DAY を INTERVAL7DAY と出力するバイナリが配布された。
# pull_request では、ビルドの手順 (Makefile の release) が通ることを、アップロードせずに確かめる。
on:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/release-assets.yml
      - Makefile
      - .versenv.env

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # gh release upload のため

env:
  WORKDIR: .

defaults:
  run:
    shell: bash

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release tag
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -Eeu -o pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid release tag: ${RELEASE_TAG}" 1>&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          # release ではリリースのタグ、pull_request では既定 (マージコミット) を checkout する
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || '' }}
          fetch-depth: 0
          # contents: write のトークンを .git/config に残さない (pull_request で PR のコードに渡さないため)
          persist-credentials: false
      - name: actions/cache for versenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/versenv
          key: versenv-${{ runner.os }}-${{ hashFiles('**/.versenv.env') }}
          restore-keys: |
            versenv-${{ runner.os }}-
      - name: Add GITHUB_PATH, GITHUB_ENV
        shell: bash
        run: |
          # Update GITHUB_PATH
          cat <<GITHUB_PATH >> $GITHUB_PATH
          ${PWD}/.local/bin
          ${PWD}/${{ env.WORKDIR }}/.local/bin
          ${PWD}/.bin
          GITHUB_PATH
          # Update GITHUB_ENV
          grep -Ev '^\s*$|^\s*#' .versenv.env >> $GITHUB_ENV
      - name: Setup versenv
        shell: bash
        run: |
          # Setup versenv
          direnv allow ${{ env.WORKDIR }}
          make versenv
      - uses: actions/setup-go@v6 # ref. https://github.com/actions/setup-go#usage
        with:
          cache: false
          go-version-file: ${{ env.WORKDIR }}/go.mod
      - name: Run go test
        if: ${{ github.event_name == 'release' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -Eeu -o pipefail -x
          direnv allow .
          direnv exec . make test
      - name: Tag the merge commit for the dry run
        if: ${{ github.event_name == 'pull_request' }}
        # make release は HEAD がタグそのものであることを求めるので、この実行の中だけのタグを付ける (push しない)
        run: |
          set -Eeu -o pipefail -x
          git tag v0.0.0-dryrun
      - name: Build (and upload) the release archives
        working-directory: ${{ env.WORKDIR }}
        env:
          # トークンはアップロードする release のときだけ渡す
          GH_TOKEN: ${{ github.event_name == 'release' && github.token || '' }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'release' && 'false' || 'true' }}
        run: |
          set -Eeu -o pipefail -x
          direnv allow .
          direnv exec . make release
      - name: Check the built binary
        # アーカイブの中のバイナリが、未コミットの変更を含まないビルド (vcs.modified=false) で、タグのバージョンであることを確かめる
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -Eeu -o pipefail -x
          tag="$(git describe --tags --exact-match HEAD)"
          dir="$(mktemp -d)"
          tar -xzf ".tmp/ddlctl_${tag}_linux_amd64.tar.gz" -C "${dir}"
          bin="$(find "${dir}" -type f -name ddlctl)"
          go version -m "${bin}" | tee "${dir}/buildinfo.txt"
          grep -Eq "^\s+mod\s+github.com/hakadoriya/ddlctl\s+${tag}\s" "${dir}/buildinfo.txt"
          grep -Eq "^\s+build\s+vcs.modified=false$" "${dir}/buildinfo.txt"
          "${bin}" version
